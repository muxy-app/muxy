name: Notify Discord

# Announces a published release again, for example after editing its notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (e.g. v2.0.0 or v2.0.0-beta.1150)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/notify-discord.py "$TAG"
