name: Release (Beta)

on:
  push:
    branches: [2.x]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    if: github.repository == 'muxy-app/muxy' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compute beta version
        id: version
        run: python3 scripts/beta_release.py version >> "$GITHUB_OUTPUT"
      - name: Reject a reused version from different history
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$GITHUB_SHA" ]]; then
              echo "Error: $TAG already points to a different commit" >&2
              exit 1
            fi
          fi

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.target }}
      cancel-in-progress: true
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            directory: arm64
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: linux
            directory: linux-x86_64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - platform: linux
            directory: linux-arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PACKAGE_DIR: target/beta/${{ needs.prepare.outputs.version }}/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-${{ matrix.target }}-baseline
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/beta
          python3 scripts/beta_release.py stamp "$VERSION"
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          : "${CERTIFICATE_P12:?Developer ID certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          : "${KEYCHAIN_PASSWORD:?Keychain password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/muxy-beta-certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Resolve signing identity
        if: runner.os == 'macOS'
        id: identity
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "Error: no Developer ID Application identity found" >&2
            exit 1
          fi
          echo "name=$IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build and sign desktop and standalone client/server pair
        if: runner.os == 'macOS'
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.name }}
        run: bash scripts/build-release.sh --arch "$ARCH" --version "$VERSION" --sign-identity "$SIGN_IDENTITY"
      - name: Notarize and verify DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "$PACKAGE_DIR/Muxy-$VERSION-$ARCH.dmg"
      - name: Notarize standalone ZIP and verify extracted executables
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "$PACKAGE_DIR/muxy-$VERSION-macos-$ARCH.zip"
      - name: Verify packaged pair, desktop bytes and standalone installation
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/muxy-$VERSION-macos-$ARCH.zip"
          --version "$VERSION" --dmg "$PACKAGE_DIR/Muxy-$VERSION-$ARCH.dmg"
          --notarized
      - name: Build and package the native glibc 2.35 pair
        if: runner.os == 'Linux'
        run: bash scripts/build-cli-linux.sh "$ARCH" "$VERSION"
      - name: Verify packaged pair and standalone installation
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/muxy-$VERSION-linux-$ARCH.tar.gz"
          --version "$VERSION"
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: beta-distribution-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.PACKAGE_DIR }}/Muxy-${{ env.VERSION }}-${{ matrix.arch }}.dmg
            ${{ env.PACKAGE_DIR }}/muxy-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
            ${{ env.PACKAGE_DIR }}/muxy-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: beta-symbols-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.zip
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-dependencies.txt
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/beta
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/muxy-beta-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/muxy-beta-certificate.p12"

  mobile-sdk:
    name: Build (mobile SDK)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-mobile-sdk
      cancel-in-progress: true
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_DIR: target/beta/${{ needs.prepare.outputs.version }}/mobile-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-mobile-sdk-baseline
      - name: Install cargo-ndk for the runner's Android NDK
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/beta target/mobile-sdk
          python3 scripts/beta_release.py stamp "$VERSION"
      - name: Build the SDK for iOS and Android
        run: bash scripts/build-mobile-sdk.sh target/mobile-sdk
      - name: Package the SDK
        run: python3 scripts/package-mobile-sdk.py "$VERSION" target/mobile-sdk "$PACKAGE_DIR"
      - name: Upload SDK archives
        uses: actions/upload-artifact@v4
        with:
          name: beta-distribution-mobile-sdk
          path: ${{ env.PACKAGE_DIR }}/muxy-mobile-${{ env.VERSION }}*
          if-no-files-found: error
          retention-days: 7
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/beta target/mobile-sdk

  release:
    concurrency:
      group: muxy-beta-2.x-feed
      cancel-in-progress: false
    needs: [prepare, build, mobile-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installer from this commit
        run: cp scripts/install-muxy.sh artifacts/install-muxy.sh
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/publish-beta.sh "$VERSION" artifacts
