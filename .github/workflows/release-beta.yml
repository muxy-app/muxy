name: Release (Beta)

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Markdown release notes; leave empty to generate them from merged pull requests"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'muxy-app/muxy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Error: run Release (Beta) on main, not ${GITHUB_REF#refs/heads/}" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compute beta version from BETA_VERSION and the commit count
        id: version
        run: python3 scripts/release.py version >> "$GITHUB_OUTPUT"
      - name: Reject a reused version from different history
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{}")" != "$GITHUB_SHA" ]]; then
              echo "Error: $TAG already points to a different commit" >&2
              exit 1
            fi
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source: ${{ github.sha }}
    secrets: inherit

  release:
    concurrency:
      group: muxy-beta-2.x-feed
      cancel-in-progress: false
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installer from this commit
        run: cp scripts/install-muxy.sh artifacts/install-muxy.sh
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: bash scripts/publish-release.sh "$VERSION" artifacts
      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: python3 scripts/notify-discord.py "$TAG"
