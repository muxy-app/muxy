name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SYS_ZIG_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  macos:
    needs: scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCOPE: ${{ needs.scope.outputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: matrix.part == 'lint'
        run: python3 scripts/protocol_fixtures.py append-only --base "$PROTOCOL_BASE"
        env:
          PROTOCOL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: zig-macos-15-0.17.0-${{ hashFiles('vendor/libghostty-vt-sys/**') }}
          restore-keys: zig-macos-15-0.17.0-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-desktop-macos.py --part "${{ matrix.part }}" --scope "$SCOPE"
      - if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - if: matrix.part == 'test' && env.SCOPE != 'desktop'
        run: python3 scripts/protocol_fixtures.py last-release
      - if: matrix.part == 'test' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'desktop' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/apt-install.sh build-essential pkg-config binutils
        timeout-minutes: 15
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: zig-ubuntu-22.04-0.17.0-${{ hashFiles('vendor/libghostty-vt-sys/**') }}
          restore-keys: zig-ubuntu-22.04-0.17.0-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-headless.py --target x86_64-unknown-linux-gnu
      - if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

  linux-desktop:
    needs: scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCOPE: ${{ needs.scope.outputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - run: >-
          bash scripts/apt-install.sh
          build-essential pkg-config clang cmake libssl-dev libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          binutils unzip
        timeout-minutes: 15
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: zig-ubuntu-24.04-0.17.0-${{ hashFiles('vendor/libghostty-vt-sys/**') }}
          restore-keys: zig-ubuntu-24.04-0.17.0-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          python3 scripts/check-desktop-linux.py --target x86_64-unknown-linux-gnu
          --part "${{ matrix.part }}" --scope "$SCOPE"
      - if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - if: matrix.part == 'test' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-linux
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCOPE: ${{ needs.scope.outputs.scope || 'full' }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - run: Set-MpPreference -DisableRealtimeMonitoring $true
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: zig-windows-latest-0.17.0-${{ hashFiles('vendor/libghostty-vt-sys/**') }}
          restore-keys: zig-windows-latest-0.17.0-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          python scripts/check-windows.py --target x86_64-pc-windows-msvc
          --part "${{ matrix.part }}" --scope "$env:SCOPE"
      - if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - if: matrix.part == 'test' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-windows
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7
