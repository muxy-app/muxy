name: Checks (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/checks-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/checks-android.yml'

jobs:
  checks:
    name: Android Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Detekt
        working-directory: android
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: ktlintCheck
        working-directory: android
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
