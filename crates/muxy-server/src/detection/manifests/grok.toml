id = "grok"
version = "2026.09.18.2"
min_engine_version = 3
updated_at = "2026-09-18T00:00:00Z"
aliases = ["grok-build"]


[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["tab:scrollback", "shift+x:dismiss"]

[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole_recent"
visible_blocker = true
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

[[rules]]
id = "background_work_chip_working"
state = "working"
priority = 1170
region = "top_non_empty_lines(1)"
visible_working = true
line_regex = ['[⋅:⸬⁙.·]\s+[1-9][0-9]*\s+│']

[[rules]]
id = "background_status_working"
state = "working"
priority = 1165
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[○◎◉]\s+[1-9][0-9]*\s+(?:commands?|monitors?|loops?|subagents?)(?:\s+·\s+[1-9][0-9]*\s+(?:commands?|monitors?|loops?|subagents?))*\s+still running(?:\s+·\s+send a message to interrupt)?\s*$']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "osc_title"
visible_idle = true
regex = ['(?:^| - )grok$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
regex = ['(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["ctrl+.:shortcuts"]
any = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 1140
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]

[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(2)"
visible_idle = true
contains = ["ctrl+.:shortcuts"]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]
