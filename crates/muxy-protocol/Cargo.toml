[package]
name = "muxy-protocol"
description = "App-server protocol boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
minicbor = { version = "2.3", features = ["std", "derive"] }
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = "1"
ring = "0.17.14"
rustix = { version = "1.1.4", features = ["event", "net"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
