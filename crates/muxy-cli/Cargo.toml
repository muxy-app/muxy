[package]
name = "muxy-cli"
description = "Muxy command-line and terminal client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "muxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
muxy-core = { path = "../muxy-core" }
muxy-protocol = { path = "../muxy-protocol" }
muxy-client = { path = "../muxy-client" }
muxy-app-core = { path = "../muxy-app-core" }
serde_json.workspace = true
serde = { version = "1.0", features = ["derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
signal-hook = "0.4"
rustix = { version = "1.1.4", features = ["termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
muxy-terminal = { path = "../muxy-terminal" }
tempfile = "3"
