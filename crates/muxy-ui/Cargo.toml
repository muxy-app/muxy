[package]
name = "muxy-ui"
description = "Reusable GPUI components for Muxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
muxy-core = { path = "../muxy-core" }
gpui = { version = "=0.2.2", default-features = false }
image = { version = "0.25", default-features = false }
unicode-segmentation = "1"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSURL", "NSNotification", "NSBundle", "NSError", "NSOperation", "NSArray", "NSEnumerator", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSFontDescriptor", "objc2-core-foundation", "NSAlert", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSApplication", "NSButton", "NSCell", "NSControl", "NSResponder", "NSView", "NSWindow", "NSScrollView", "NSScroller", "NSClipView", "NSEvent", "NSAppearance", "block2", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "libc", "NSAccessibilityElement", "NSColor", "NSScreen", "NSWorkspace", "NSRunningApplication", "NSTextInputContext", "objc2-core-graphics", "objc2-quartz-core"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
