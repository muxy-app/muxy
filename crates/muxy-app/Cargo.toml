[package]
name = "muxy-app"
description = "The Muxy app executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25", default-features = false, features = ["png"] }
muxy-core = { path = "../muxy-core" }
muxy-ui = { path = "../muxy-ui" }
async-channel = "2"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde_json.workspace = true
tempfile = "3"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
muxy-app-core = { path = "../muxy-app-core" }
muxy-client = { path = "../muxy-client" }
muxy-protocol = { path = "../muxy-protocol" }

[dev-dependencies]
muxy-ui = { path = "../muxy-ui", features = ["test-support"] }
muxy-terminal = { path = "../muxy-terminal" }
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

[lints]
workspace = true
