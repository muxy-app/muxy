[package]
name = "muxy-app"
description = "The Muxy app executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
muxy-core = { path = "../muxy-core" }
muxy-ui = { path = "../muxy-ui" }
async-channel = "2"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots", "socks"] }
serde_json.workspace = true
tempfile = "3"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
muxy-app-core = { path = "../muxy-app-core" }
muxy-client = { path = "../muxy-client" }
muxy-protocol = { path = "../muxy-protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
muxy-core = { path = "../muxy-core", features = ["test-support"] }
muxy-ui = { path = "../muxy-ui", features = ["test-support"] }
muxy-terminal = { path = "../muxy-terminal" }
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xim-ctext = "0.3"

[lints]
workspace = true
